name: 🐳 Build and push Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-metadata:
    name: 🏷️ Prepare image metadata
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      image-url: ${{ steps.image.outputs.url }}

    steps:
      - name: 🔍 Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔗 Select primary image URL
        id: image
        env:
          IMAGE_URL: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          echo "url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: 🚀 Build and push image
    runs-on: ubuntu-latest
    needs:
      - prepare-metadata

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-url: ${{ needs.prepare-metadata.outputs.image-url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true

          tags: ${{ needs.prepare-metadata.outputs.tags }}
          labels: ${{ needs.prepare-metadata.outputs.labels }}

          build-args: |
            DD_GIT_REPOSITORY_URL=https://github.com/${{ github.repository }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
        
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-summary:
    name: 📦 Show published image
    runs-on: ubuntu-latest
    needs:
      - prepare-metadata
      - build-and-push

    steps:
      - name: 📝 Write workflow summary
        env:
          IMAGE_URL: ${{ needs.prepare-metadata.outputs.image-url }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          echo "Published image: $IMAGE_URL"
          echo "Image digest: $IMAGE_DIGEST"

          {
            echo "## 🎉 Published Docker image"
            echo
            echo "**Image URL**"
            echo '```text'
            echo "$IMAGE_URL"
            echo '```'
            echo
            echo "**Digest**"
            echo '```text'
            echo "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
